_schema-version: 3.3.0
ID: pkFirstCapApp
description: A simple CAP project.
version: 1.0.0
modules:
- name: pkFirstCapApp-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: pkFirstCapApp-auth
  - name: pkFirstCapApp-db
  - name: pkFirstCapApp-postgres
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
  build-parameters:
    builder: npm-ci
- name: pkFirstCapApp-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: pkFirstCapApp-db
  parameters:
    buildpack: nodejs_buildpack
- name: pkFirstCapApp-postgres-deployer
  type: nodejs
  path: gen/pg
  requires:
  - name: pkFirstCapApp-postgres
  parameters:
    buildpack: nodejs_buildpack
    no-route: true
    no-start: true
    tasks:
    - command: npm start
      name: deploy-to-postgresql
- name: pkFirstCapApp-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: pkFirstCapApp-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - pkbooklist.zip
      name: pkbooklist
      target-path: resources/
- name: pkbooklist
  type: html5
  path: app/booklist
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: pkFirstCapApp-auth
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      tenant-mode: dedicated
      xsappname: pkFirstCapApp-${org}-${space}
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
- name: pkFirstCapApp-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: pkFirstCapApp-postgres
  type: org.cloudfoundry.managed-service
  parameters:
    service: postgresql-db
    service-plan: development
- name: pkFirstCapApp-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: pkFirstCapApp-html5-service
    service-plan: app-host
- name: pkFirstCapApp-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: false
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: pkFirstCapApp-destination-service
    service-plan: lite
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
